# Compile les applications PC (Windows, Linux) et Android À LA DEMANDE uniquement :
# GitHub > Actions > « Applications PC et Android » > Run workflow > choisir l'application.
# Les fichiers sont publiés dans la release vX.Y.Z (version de package.json) ; les anciennes
# releases et les fichiers de compilation intermédiaires sont ensuite supprimés.
name: Applications PC et Android

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application à compiler
        type: choice
        default: tout
        options: [tout, android, windows, linux]

permissions:
  contents: write
  actions: write

concurrency:
  group: apps
  cancel-in-progress: false

env:
  FORCE_COLOR: "0"

jobs:
  desktop:
    name: PC (${{ matrix.name }})
    if: inputs.app != 'android'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.app == 'windows' && '[{"name":"Windows","os":"windows-latest","target":"--win"}]' || inputs.app == 'linux' && '[{"name":"Linux","os":"ubuntu-latest","target":"--linux"}]' || '[{"name":"Windows","os":"windows-latest","target":"--win"},{"name":"Linux","os":"ubuntu-latest","target":"--linux"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

      - name: Empaqueter l'application
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Tester l'application empaquetée (fenêtre réelle, conversions, mot de passe, téléchargement)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          APP_PATH="$PWD/release-desktop/linux-unpacked/yonks-pdf-converter" xvfb-run -a npm run test:desktop

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release-desktop/*.exe
            release-desktop/*.AppImage
            release-desktop/*.deb

  android:
    name: Android
    if: inputs.app == 'tout' || inputs.app == 'android'
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: SDK Android (préinstallé sur les machines GitHub) — licences
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Clé de signature privée (si les secrets sont configurés)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "Signature avec la clé privée du dépôt."
          else
            echo "Aucun secret ANDROID_KEYSTORE_BASE64 : signature avec la clé de test publique."
          fi

      - name: Compiler l'APK (et l'AAB Play Store si clé privée)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TASKS="assembleRelease"
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then TASKS="assembleRelease bundleRelease"; fi
          ./gradlew $TASKS --no-daemon --stacktrace

      - name: Renommer et vérifier
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Yonks-PDF-Converter-$V-android.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/Yonks-PDF-Converter-$V-android.aab"
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "out/Yonks-PDF-Converter-$V-android.apk"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "out/Yonks-PDF-Converter-$V-android.apk" | head -5
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          retention-days: 1
          if-no-files-found: error
          path: out/*

  release:
    name: Publier et nettoyer
    needs: [desktop, android]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - run: ls -la files

      - name: Publier dans la release de la version courante
        run: |
          V=$(ls files | sed -n 's/^Yonks-PDF-Converter-\([0-9][0-9.]*\)-.*/\1/p' | head -1)
          if [ -z "$V" ]; then echo "Version introuvable"; exit 1; fi
          echo "V=$V" >> "$GITHUB_ENV"
          if gh release view "v$V" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "v$V" files/* -R "$REPO" --clobber
          else
            gh release create "v$V" files/* -R "$REPO" --target "$GITHUB_SHA" --latest \
              --title "Yonk's PDF Converter v$V" --notes-file - << 'NOTES'
          ## Téléchargements
          - **Windows** : `…-windows-setup.exe` (installateur) ou `…-windows-portable.exe` (sans installation)
          - **Linux** : `…-linux-x86_64.AppImage` (rendre exécutable puis lancer) ou `…-linux-amd64.deb`
          - **Android** : `…-android.apk` (autoriser l'installation depuis cette source)

          Tout fonctionne hors ligne : vos PDF ne quittent jamais votre appareil.
          NOTES
          fi

      - name: Supprimer les anciennes releases et les fichiers de compilation
        run: |
          gh release list -R "$REPO" --limit 100 --json tagName -q '.[].tagName' | while read -r t; do
            if [ "$t" != "v$V" ]; then echo "Suppression de la release $t"; gh release delete "$t" -R "$REPO" -y --cleanup-tag; fi
          done
          gh api "repos/$REPO/actions/artifacts?per_page=100" -q '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" > /dev/null && echo "Artefact $id supprimé"
          done
